[[redirects]]
  from = "https://rohit.onl/*"
  to = "https://www.rohit.onl/:splat"
  status = 301
  force = true

[[edge_functions]]
  function = "feed-canonicalize"
  path = "/feed"

[[edge_functions]]
  function = "feed-canonicalize"
  path = "/feed/"

[[edge_functions]]
  function = "feed-canonicalize"
  path = "/feed.xml"

[[headers]]
  for = "/feed/"

  [headers.values]
    Content-Type = "application/atom+xml; charset=UTF-8"
